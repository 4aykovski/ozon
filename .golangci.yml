version: "2"
run:
  allow-parallel-runners: true
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - errname
    - funlen
    - gochecknoglobals
    - gocognit
    - gocyclo
    - godox
    - goheader
    - govet
    - importas
    - intrange
    - ireturn
    - lll
    - nlreturn
    - nonamedreturns
    - tagalign
    - tagliatelle
    - varnamelen
    - whitespace
  settings:
    exhaustruct:
      exclude:
        - net/http\.Transport
        - net/http\.Server
        - net/http\.Client
        - crypto/tls\.Config
    forbidigo:
      forbid:
        - pattern: (?i)(^|\.)print(f|ln)?$
    gomoddirectives:
      replace-local: true
    gosec:
      config:
        G306: "0666"
    mnd:
      ignored-functions:
        - os\.(OpenFile|WriteFile|Chmod),p?flag\..*
        - strconv\.(Format|Parse|Append).*
    revive:
      confidence: 0.8
      enable-all-rules: true
      rules:
        - name: function-length
          arguments:
            - 50
            - 0
          severity: warning
          disabled: false
        - name: function-result-limit
          arguments:
            - 3
          severity: warning
          disabled: false
        - name: cognitive-complexity
          arguments:
            - 25
          severity: warning
          disabled: false
        - name: cyclomatic
          arguments:
            - 10
          severity: warning
          disabled: false
        - name: line-length-limit
          arguments:
            - 120
          severity: warning
          disabled: false
        - name: argument-limit
          arguments:
            - 6
          severity: warning
          disabled: false
        - name: unhandled-error
          arguments:
            - bytes\.Buffer\.Write.*
            - strings\.Builder\.Write.*
          disabled: false
        - name: comment-spacings
          disabled: true
        - name: unchecked-type-assertion
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: banned-characters
          disabled: true
        - name: file-header
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: struct-tag
          disabled: true
        - name: add-constant
          disabled: true
        - name: empty-lines
          disabled: true
        - name: range-val-in-closure
          disabled: true
    testifylint:
      disable:
        - require-error
    wsl:
      force-case-trailing-whitespace: 1
      allow-trailing-comment: true
      allow-separated-leading-comment: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: true
formatters:
  enable:
    - gci
  settings:
    gci:
      sections:
        - standard
        - localmodule
        - blank
        - default
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
